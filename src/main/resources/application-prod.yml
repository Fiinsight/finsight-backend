spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

finsight:
  auth:
    jwt-secret: ${JWT_SECRET}
  security:
    public-api-docs: false
  cors:
    allowed-origin-patterns: ${FRONTEND_ORIGIN}
