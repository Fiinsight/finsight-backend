spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

finsight:
  auth:
    # Production must provide a private, base64-encoded secret; never use the
    # development fallback from application.yml in a deployed environment.
    jwt-secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  cors:
    allowed-origin-patterns: ${FRONTEND_ORIGIN}
