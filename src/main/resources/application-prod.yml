spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

finsight:
  cors:
    allowed-origin-patterns: ${FRONTEND_ORIGIN:http://localhost:*,http://127.0.0.1:*}
