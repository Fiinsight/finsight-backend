server:
  port: 8080

spring:
  application:
    name: finsight-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finsight}
    username: ${DB_USERNAME:finsight}
    password: ${DB_PASSWORD:finsight}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

finsight:
  auth:
    jwt-secret: ${JWT_SECRET:Zm9yLWxvY2FsLWRldmVsb3BtZW50LXNlY3JldC1jaGFuZ2UtbWU=}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
    kakao-client-id: ${KAKAO_CLIENT_ID:}
    kakao-client-secret: ${KAKAO_CLIENT_SECRET:}
    # Kakao Developers에 동일한 LAN/운영 URI를 등록하고, 운영 환경에서는 KAKAO_REDIRECT_URI로 덮어쓴다.
    kakao-redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}
    kakao-app-redirect-uri: ${KAKAO_APP_REDIRECT_URI:finsight://auth/kakao}
    # OAuth state는 허용된 앱 스킴 또는 명시된 로컬 웹 콜백만 통과시킨다.
    kakao-web-redirect-uris: ${KAKAO_WEB_REDIRECT_URIS:http://localhost:8081/auth/kakao,http://localhost:8082/auth/kakao,http://127.0.0.1:8081/auth/kakao,http://127.0.0.1:8082/auth/kakao}
  cors:
    allowed-origin-patterns: ${FINSIGHT_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8001}
  kis:
    base-url: ${KIS_BASE_URL:https://openapivts.koreainvestment.com:29443}
    app-key: ${KIS_APP_KEY:}
    app-secret: ${KIS_APP_SECRET:}
    account-no: ${KIS_ACCOUNT_NO:}
  ecos:
    base-url: ${ECOS_BASE_URL:https://ecos.bok.or.kr/api}
    api-key: ${ECOS_API_KEY:}
  naver-fx:
    base-url: ${NAVER_FX_BASE_URL:https://api.stock.naver.com}
  dart:
    base-url: ${DART_BASE_URL:https://opendart.fss.or.kr/api}
    api-key: ${DART_API_KEY:}
